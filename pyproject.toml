[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeon-siege-rpc"
version = "0.1.0"
description = "Dungeon Siege RPC refactored into smaller modules"
requires-python = ">=3.10"
dependencies = [
  "pypresence>=4.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
